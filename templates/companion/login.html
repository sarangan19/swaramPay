<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SwaramPay Guardian Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #dff3ff;
      --grid: #c7e8fb;
      --card: #fffdf8;
      --ink: #2b2b2b;
      --primary: #ffb74d;
      --primary-shadow: #c97f1f;
      --secondary: #7ec8e3;
      --secondary-shadow: #4a93ad;
      --error-bg: #ffe3e3;
      --error-border: #ff6b6b;
      --error-text: #c0392b;
      --muted: #6b6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 1rem;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 2px, transparent 2px),
        linear-gradient(90deg, var(--grid) 2px, transparent 2px);
      background-size: 32px 32px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 4px solid var(--ink);
      box-shadow: 10px 10px 0 rgba(0,0,0,0.15);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
    }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-shadow);
      letter-spacing: 0.5px;
      text-shadow: 3px 3px 0 var(--secondary);
    }
    #brand-name {
      display: inline-block;
      min-width: 4em;
      text-align: center;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    #brand-name.slide-out {
      opacity: 0;
      transform: translateX(-24px);
    }
    #brand-name.slide-in-prep {
      opacity: 0;
      transform: translateX(24px);
      transition: none;
    }
    .logo img {
      width: 64px;
      height: 64px;
      vertical-align: middle;
      margin-right: 0.5rem;
    }
    .logo p { color: var(--muted); font-size: 0.95rem; margin-top: 0.6rem; }
    label {
      display: block;
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      color: var(--muted);
    }
    input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    input:focus { background: var(--bg); transform: translate(-2px, -2px); }
    .field { margin-bottom: 1.4rem; }
    .btn {
      display: block;
      width: 100%;
      padding: 0.9rem;
      font-family: inherit;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.3px;
      text-align: center;
      cursor: pointer;
      border: 3px solid var(--ink);
      border-radius: 0;
      background: var(--primary);
      color: var(--ink);
      box-shadow: 5px 5px 0 var(--primary-shadow);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 var(--primary-shadow);
    }
    .btn:active {
      transform: translate(5px, 5px);
      box-shadow: 0 0 0 var(--primary-shadow);
    }
    .btn-outline {
      background: var(--secondary);
      box-shadow: 5px 5px 0 var(--secondary-shadow);
      margin-bottom: 1.2rem;
    }
    .btn-outline:hover {
      transform: translate(-2px, -2px);
      box-shadow: 7px 7px 0 var(--secondary-shadow);
    }
    .btn-outline:active {
      transform: translate(5px, 5px);
      box-shadow: 0 0 0 var(--secondary-shadow);
    }
    .otp-row { display: none; margin-top: 1.2rem; }
    .error {
      background: var(--error-bg);
      border: 3px solid var(--error-border);
      color: var(--error-text);
      padding: 0.7rem 1rem;
      margin-bottom: 1.2rem;
      font-size: 1rem;
    }
    .info { color: var(--muted); font-size: 0.95rem; text-align: center; margin-top: 1.4rem; line-height: 1.5; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1><img src="{{ url_for('static', filename='img/logo.png') }}" alt="SwaramPay logo"/><span id="brand-name">Swaram</span>Pay</h1>
    <p>Guardian Companion Portal</p>
  </div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <div class="field">
    <label>Your 10-digit Mobile Number</label>
    <input type="tel" id="phone" maxlength="10" placeholder="98xxxxxxxx" autocomplete="tel"/>
  </div>

  <button class="btn btn-outline" onclick="sendOTP()">Send OTP via SMS</button>

  <div class="otp-row" id="otp-row">
    <form method="POST" action="/companion/verify-otp">
      <div class="field">
        <label>Enter OTP</label>
        <input type="text" name="otp" id="otp" maxlength="6" placeholder="6-digit OTP" autocomplete="one-time-code"/>
        <input type="hidden" name="phone" id="phone-hidden"/>
      </div>
      <button type="submit" class="btn">Verify &amp; Login</button>
    </form>
  </div>

  <p class="info">Only registered guardians can log in. Contact your ward to be added as a guardian.</p>
</div>

<script>
  // Cycle "Swaram" through its rendering in the 10 languages SwaramPay supports; "Pay" stays static in English.
  const BRAND_NAMES = [
    'Swaram',   // English
    'स्वरम',     // Hindi
    'ஸ்வரம்',    // Tamil
    'స్వరమ్',    // Telugu
    'ಸ್ವರಮ್',    // Kannada
    'സ്വരം',     // Malayalam
    'स्वरम',     // Marathi
    'স্বরম',     // Bengali
    'સ્વરમ',     // Gujarati
    'ਸਵਰਮ',     // Punjabi
  ];
  function slideTo(el, finalText) {
    el.classList.add('slide-out');
    setTimeout(() => {
      el.textContent = finalText;
      el.classList.remove('slide-out');
      el.classList.add('slide-in-prep');
      void el.offsetWidth;
      el.classList.remove('slide-in-prep');
    }, 450);
  }

  (function cycleBrandName() {
    const el = document.getElementById('brand-name');
    let i = 0;
    setInterval(() => {
      i = (i + 1) % BRAND_NAMES.length;
      slideTo(el, BRAND_NAMES[i]);
    }, 3500);
  })();

  async function sendOTP() {
    const phone = document.getElementById('phone').value.trim();
    if (phone.length !== 10 || !/^\d+$/.test(phone)) {
      alert('Please enter a valid 10-digit mobile number.');
      return;
    }
    const formData = new FormData();
    formData.append('phone', phone);
    const res = await fetch('/companion/send-otp', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.status === 'sent') {
      document.getElementById('otp-row').style.display = 'block';
      document.getElementById('phone-hidden').value = phone;
      alert('OTP sent! Check your SMS.');
    } else {
      alert(data.error || 'Failed to send OTP.');
    }
  }
</script>
</body>
</html>
